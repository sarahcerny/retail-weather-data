[project]
name = "retail-weather-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarah Cerny", email = "scerny@byu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
retail-weather-data = "retail_weather_data:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
